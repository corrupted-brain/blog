<div class="social-share">
  <h4>Share on</h4>
  <ul>
    <li>
      <a href="https://twitter.com/intent/tweet?text={{ page.title | uri_escape }}%20{{ page.url | absolute_url | uri_escape }}" class="twitter" aria-label="Share on Twitter"><i class="fa fa-twitter" aria-hidden="true"></i><span> Twitter</span></a>
    </li>
    <li>
      <a href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absolute_url | uri_escape }}" class="facebook" aria-label="Share on Facebook"><i class="fa fa-facebook" aria-hidden="true"></i><span> Facebook</span></a>
    </li>
    <li>
      <a href="https://www.linkedin.com/shareArticle?mini=true&amp;url={{ page.url | absolute_url | uri_escape }}&amp;title={{ page.title | uri_escape }}&amp;summary={{ page.excerpt | strip_html | uri_escape }}&amp;source={{ site.url | uri_escape }}" class="linkedin" aria-label="Share on LinkedIn"><i class="fa fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span></a>
    </li>
  </ul>
</div><!-- /.social-share -->
